name: Verify Codey macOS Seatbelt

on:
  push:
    branches: [verify/codey-macos-seatbelt]
    paths: [.github/workflows/codey-macos-seatbelt.yml]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Check out fixed Codey candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b2f6d6c60722eb8d346070e365f0be5bad92371b
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.22.3"
          package-manager-cache: false
      - name: Install public test and repository dependencies
        run: |
          sw_vers
          uname -m
          git rev-parse HEAD
          npm ci --ignore-scripts --no-audit --no-fund
          node codey/hydrate-model-data.mjs
          python3 -m venv "$RUNNER_TEMP/codey-test"
          "$RUNNER_TEMP/codey-test/bin/pip" install --disable-pip-version-check pexpect==4.9.0 ptyprocess==0.7.0
      - name: Exercise real macOS Seatbelt with a synthetic project and model
        run: |
          node --test codey/test/macos-sandbox.test.mjs
          "$RUNNER_TEMP/codey-test/bin/python" codey/sandbox/macos/integration.py ./codey/bin/codey
          ./codey/bin/codey --version
          ./codey/bin/codey sandbox --help
      - name: Read Seatbelt diagnostics if the check failed
        if: failure()
        run: |
          /usr/bin/log show --last 3m --info --debug --style compact --predicate 'eventMessage CONTAINS[c] "sandbox" AND (eventMessage CONTAINS[c] "node" OR eventMessage CONTAINS[c] "codey-sandbox")' | tail -n 80
          report="$(find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name 'node-*.ips' -mmin -4 -print 2>/dev/null | head -n 1)"
          if [[ -n "$report" ]]; then
            sed '1d' "$report" | jq -c '{termination,exception,asi,faultingThread,frames:.threads[.faultingThread].frames[:12]}'
          fi
          test_dir="$(mktemp -d)"
          node_path="$(node -p 'process.execPath')"
          test_dir="$(cd "$test_dir" && pwd -P)"
          for kind in sh node; do
            if [[ "$kind" == sh ]]; then
              probe=(/bin/sh -c 'printf "shell starts\\n"')
            else
              probe=("$node_path" --jitless -e 'console.log("node starts")')
            fi
            cache="$(node -e 'const f=require("fs"); for(const d of ["/System/Cryptexes/OS","/System/Volumes/Preboot/Cryptexes/OS","/private/preboot/Cryptexes/OS"]) {try {const p=f.realpathSync(d+"/System/Library/dyld");if(p.startsWith("/System/Volumes/Preboot/")||p.startsWith("/private/preboot/")){console.log(p);process.exit()}}catch{}} console.log("/System/Library/dyld")')"
            if /usr/bin/env -i PATH=/usr/bin:/bin HOME="$test_dir" TMPDIR="$test_dir" /usr/bin/sandbox-exec \
              -f "$PWD/codey/sandbox/macos/profile.sbpl" -D "WORKSPACE=$test_dir" -D "SCRATCH=$test_dir" \
              -D "INSTALL=$PWD" -D "NODE=$node_path" -D "TOOLCHAIN=/dev/null" -D "TOOLCHAIN_LINKS=/dev/null" -D "DYLD_CACHE=$cache" "${probe[@]}"; then
              echo "Probe passed: $kind"
            else
              echo "Probe failed: $kind, status $?"
            fi
          done
