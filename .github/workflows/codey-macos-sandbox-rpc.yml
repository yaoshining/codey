name: Verify Codey macOS sandbox RPC
on:
  push:
    branches: [verify/codey-macos-sandbox-rpc]
    paths: [.github/workflows/codey-macos-sandbox-rpc.yml]
permissions:
  contents: read
jobs:
  seatbelt:
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3d3669adf11867d43a94498106f7d50ce1e180a1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
      - name: Prepare synthetic fixtures
        run: |
          sw_vers
          uname -m
          node --version
          git rev-parse HEAD
          npm ci --ignore-scripts --no-audit --no-fund
          node codey/hydrate-model-data.mjs
          python3 -m venv "$RUNNER_TEMP/codey-test"
          "$RUNNER_TEMP/codey-test/bin/pip" install --disable-pip-version-check pexpect==4.9.0 ptyprocess==0.7.0
      - name: Real Apple Seatbelt and T3-shaped JSONL
        run: python3 codey/sandbox/macos/rpc.integration.py ./codey/bin/codey
      - name: Ordinary RPC and existing sandbox terminal
        run: |
          node --test codey/test/macos-sandbox.test.mjs codey/test/review.test.mjs
          "$RUNNER_TEMP/codey-test/bin/python" codey/sandbox/macos/integration.py ./codey/bin/codey
          "$RUNNER_TEMP/codey-test/bin/python" codey/sandbox/macos/worktree.integration.py ./codey/bin/codey
