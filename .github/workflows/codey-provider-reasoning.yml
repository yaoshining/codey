name: Verify Codey provider reasoning
on:
  push:
    branches: [verify/codey-provider-reasoning]
    paths: [.github/workflows/codey-provider-reasoning.yml]
permissions:
  contents: read
jobs:
  provider:
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 188dc7087fe77e6196307974483f7dc199d392b2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
      - name: Prepare synthetic fixtures
        run: |
          sw_vers
          uname -m
          node --version
          git rev-parse HEAD
          npm ci --ignore-scripts --no-audit --no-fund
          node codey/hydrate-model-data.mjs
          python3 -m venv "$RUNNER_TEMP/codey-test"
          "$RUNNER_TEMP/codey-test/bin/pip" install --disable-pip-version-check pexpect==4.9.0 ptyprocess==0.7.0
      - name: Real terminal and ordinary and Seatbelt RPC reasoning
        run: '"$RUNNER_TEMP/codey-test/bin/python" codey/test/provider-reasoning.integration.py ./codey/bin/codey'
      - name: Provider and Seatbelt RPC regressions
        run: |
          node --import ./packages/coding-agent/src/experimental/source-resolver.ts --test codey/test/provider-endpoint.test.mjs codey/test/provider-catalog.test.mjs
          "$RUNNER_TEMP/codey-test/bin/python" codey/test/provider.integration.py ./codey/bin/codey
          "$RUNNER_TEMP/codey-test/bin/python" codey/test/provider-lan.integration.py ./codey/bin/codey
          python3 codey/sandbox/macos/rpc.integration.py ./codey/bin/codey
