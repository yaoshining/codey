name: Verify Codey direct LAN HTTP MCP
on:
  push:
    branches: [verify/codey-mcp-lan-http]
    paths: [.github/workflows/codey-mcp-lan-http.yml]
permissions:
  contents: read
jobs:
  mcp:
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 20d1989eac997dd07772f0e04d452e58d702bdee
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
      - name: Verify candidate checkout and prepare fixtures
        run: |
          sw_vers
          uname -m
          node --version
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = 20d1989eac997dd07772f0e04d452e58d702bdee
          npm ci --ignore-scripts --no-audit --no-fund
          node codey/hydrate-model-data.mjs
          python3 -m venv "$RUNNER_TEMP/codey-test"
          "$RUNNER_TEMP/codey-test/bin/pip" install --disable-pip-version-check pexpect==4.9.0 ptyprocess==0.7.0
      - name: Direct LAN HTTP MCP terminal and RPC isolation
        run: |
          log="$RUNNER_TEMP/lan-mcp.log"
          if CODEY_TEST_TTY_LOG=1 "$RUNNER_TEMP/codey-test/bin/python" codey/test/mcp-plain-http.integration.py ./codey/bin/codey >"$log" 2>&1; then
            grep 'PASS /mcp add' "$log" | cut -c1-350
          else
            tail -c 20000 "$log"
            exit 1
          fi
      - name: HTTPS direct, bridge and OAuth regressions
        run: |
          export CODEY_TEST_OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          if [[ ! -x "$CODEY_TEST_OPENSSL" ]]; then brew install openssl@3; fi
          "$CODEY_TEST_OPENSSL" version
          "$RUNNER_TEMP/codey-test/bin/python" codey/test/mcp-direct.integration.py ./codey/bin/codey
          "$RUNNER_TEMP/codey-test/bin/python" codey/test/mcp-bridge.integration.py ./codey/bin/codey
          "$RUNNER_TEMP/codey-test/bin/python" codey/test/mcp-bridge-oauth.integration.py ./codey/bin/codey
      - name: Shared provider LAN transport regression
        run: |
          node --import ./packages/coding-agent/src/experimental/source-resolver.ts --test codey/test/provider-endpoint.test.mjs codey/test/mcp-ca.test.mjs codey/test/mcp-oauth.test.mjs
          "$RUNNER_TEMP/codey-test/bin/python" codey/test/provider-lan.integration.py ./codey/bin/codey
