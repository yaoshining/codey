name: Verify Codey macOS sandbox review

on:
  push:
    branches: [verify/codey-macos-sandbox-review]
    paths: [.github/workflows/codey-macos-sandbox-review.yml]

permissions:
  contents: read

jobs:
  seatbelt:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Check out fixed Codey candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 67e51f4e1fa3c7013339e02205f89c4de13d5e05
          persist-credentials: false
      - name: Select Homebrew Node 26
        run: |
          brew install node
          prefix="$(brew --prefix node)"
          "$prefix/bin/node" -e 'process.exit(process.versions.node.startsWith("26.") ? 0 : 1)'
          printf '%s\n' "$prefix/bin" >> "$GITHUB_PATH"
      - name: Prepare synthetic fixtures
        run: |
          sw_vers
          uname -m
          git rev-parse HEAD
          /usr/bin/xcrun --find git
          node -p 'JSON.stringify(process.versions)'
          npm ci --ignore-scripts --no-audit --no-fund
          node codey/hydrate-model-data.mjs
          python3 -m venv "$RUNNER_TEMP/codey-test"
          "$RUNNER_TEMP/codey-test/bin/pip" install --disable-pip-version-check pexpect==4.9.0 ptyprocess==0.7.0
      - name: Test real Seatbelt and both review entry points
        run: |
          node --test codey/test/macos-review.test.mjs codey/test/macos-sandbox.test.mjs codey/test/review.test.mjs
          "$RUNNER_TEMP/codey-test/bin/python" codey/sandbox/macos/integration.py ./codey/bin/codey
      - name: Inspect sandbox denials if the synthetic test failed
        if: failure()
        run: |
          /usr/bin/log show --last 5m --style compact --predicate 'eventMessage CONTAINS[c] "sandbox" AND (eventMessage CONTAINS[c] ".git/" OR eventMessage CONTAINS[c] "codey-sandbox-review" OR eventMessage CONTAINS[c] "process-exec")' | tail -n 80
