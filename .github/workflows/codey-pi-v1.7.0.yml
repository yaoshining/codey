name: Verify Codey Pi v1.7.0 sync on macOS
on:
  push:
    branches: [verify/codey-pi-v1.7.0]
    paths: [.github/workflows/codey-pi-v1.7.0.yml]
permissions:
  contents: read
jobs:
  acp:
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 91797894b67cfa77a6a86314c4a41a50c8a8e225
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.13.1
      - name: Verify Codey revision and perform fixed install in a synthetic HOME
        run: |
          sw_vers
          uname -m
          node --version
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = 91797894b67cfa77a6a86314c4a41a50c8a8e225
          env -u SHELL HOME="$RUNNER_TEMP/install-home" CODEY_INSTALL_DIR="$RUNNER_TEMP/codey-installed" CODEY_BIN_DIR="$RUNNER_TEMP/codey-bin" bash ./codey/install.sh 91797894b67cfa77a6a86314c4a41a50c8a8e225
          git -C "$RUNNER_TEMP/codey-installed/91797894b67cfa77a6a86314c4a41a50c8a8e225" rev-parse HEAD
          test "$(env HOME="$RUNNER_TEMP/install-home" PI_OFFLINE=1 "$RUNNER_TEMP/codey-bin/codey" --version)" = 0.1.0
          test "$(env HOME="$RUNNER_TEMP/install-home" PI_OFFLINE=1 "$RUNNER_TEMP/codey-bin/codey" --pi-version)" = 1.7.0
          env HOME="$RUNNER_TEMP/install-home" PI_OFFLINE=1 "$RUNNER_TEMP/codey-bin/codey" --version
          env HOME="$RUNNER_TEMP/install-home" PI_OFFLINE=1 "$RUNNER_TEMP/codey-bin/codey" --pi-version
      - name: Test the Seatbelt terminal, approval and inline review
        run: |
          python3 -m venv "$RUNNER_TEMP/terminal-test-python"
          "$RUNNER_TEMP/terminal-test-python/bin/pip" install 'pexpect==4.9.0'
          "$RUNNER_TEMP/terminal-test-python/bin/python" codey/sandbox/macos/integration.py "$RUNNER_TEMP/codey-installed/91797894b67cfa77a6a86314c4a41a50c8a8e225/codey/bin/codey"
